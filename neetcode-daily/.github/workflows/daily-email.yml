name: Daily question email

on:
  schedule:
    # 12:00 UTC — morning in US/EU, evening in East Asia
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify digest
        run: npm test
      - name: Preview digest
        run: npm run email:preview -- --out daily-email-preview.html
      - name: Send email
        run: npm run email:send
        env:
          DAILY_EMAIL_TO: ${{ secrets.DAILY_EMAIL_TO }}
          DAILY_EMAIL_FROM: ${{ secrets.DAILY_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
